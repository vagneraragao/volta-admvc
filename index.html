<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Campanha VOLTA da ADMVC — contagem de garrafas retornáveis para a construção da Nova Sede.">
  <meta name="theme-color" content="#14663A">
  <title>VOLTA ADMVC</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314663A'/><path d='M13 4h6v3.2c0 1.2.5 2.3 1.4 3.1l1.2 1.1c1.2 1.1 1.9 2.7 1.9 4.3V27a2 2 0 0 1-2 2H10.5a2 2 0 0 1-2-2V15.7c0-1.6.7-3.2 1.9-4.3l1.2-1.1C12.5 9.5 13 8.4 13 7.2V4Z' fill='none' stroke='%235FD683' stroke-width='2.2' stroke-linejoin='round'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap">

  <link rel="stylesheet" href="src/estilo.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Nota: este é o CDN de desenvolvimento do Tailwind. Ele funciona em
    // produção, mas compila no navegador a cada carregamento e avisa no
    // console. O README explica como trocar por um CSS pré-compilado.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            verde: '#2FB65A',
            'verde-claro': '#5FD683',
            'verde-fundo': '#14663A',
            'verde-noite': '#0C3A22',
            grafite: '#1B1D1A',
            'grafite-2': '#262925',
            'grafite-3': '#343830',
            creme: '#F2F4F0',
            'creme-2': '#E4E8E0',
            dourado: '#D9A441',
            tinta: '#14171A',
            'tinta-suave': '#5A635C',
          },
          fontFamily: {
            display: ['Archivo', 'system-ui', 'sans-serif'],
            serifa: ['Fraunces', 'Georgia', 'serif'],
          },
          // A escala padrão pula degraus (15, 35, 45, 65…) e os modificadores
          // de cor — text-creme/45 — resolvem por ela.
          opacity: (function () {
            const escala = {};
            for (let i = 0; i <= 100; i += 5) escala[String(i)] = String(i / 100);
            return escala;
          })(),
        },
      },
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.js"></script>
</head>
<body>
  <!-- O conteúdo abaixo é substituído pelo React ao montar. Ele existe para
       que um tablet com a rede ruim veja uma explicação em vez de tela branca. -->
  <div id="raiz">
    <div id="aviso-carregando" style="padding:32px;max-width:34rem;margin:0 auto;font-family:system-ui,sans-serif;color:#5A635C">
      <p style="font-size:1.5rem;font-weight:800;color:#14663A;margin:0 0 .5rem">VOLTA · ADMVC</p>
      <p style="margin:0">Carregando a campanha…</p>
      <p id="aviso-falha" hidden style="margin:1rem 0 0;padding:1rem;border-radius:.75rem;background:#FBF3E2;color:#14171A">
        <strong>Não consegui carregar os componentes da página.</strong><br>
        Isso quase sempre é a internet do aparelho. Confira a conexão e recarregue.
      </p>
    </div>
  </div>

  <noscript>
    <p style="padding:24px;font-family:system-ui">
      Esta aplicação precisa de JavaScript para registrar as doações da campanha VOLTA.
    </p>
  </noscript>

  <script>
    // Se React, ReactDOM ou htm não chegaram do CDN, o app não monta — então
    // troque o "carregando" por algo que diga o que houve.
    setTimeout(function () {
      var faltou = !window.React || !window.ReactDOM || !window.htm;
      var aindaNaTela = document.getElementById('aviso-carregando');
      var falha = document.getElementById('aviso-falha');
      if (faltou && aindaNaTela && falha) falha.hidden = false;
    }, 6000);
  </script>

  <script type="module" src="src/app.js"></script>
</body>
</html>
