:root{
  --ciano:#0CC3D7; --ciano2:#0AA6B7; --agua:#E8FAFC; --noite:#062A30; --noite2:#0B3A42;
  --tijolo:#C1663A;--tijolo2:#9E4F2B; --marinho:#1B2A44; --areia:#EFEAE1;
  --oliva:#4A5D3A; --oliva2:#2F3D26; --ouro:#C89B4A;
  --creme:#F7FAFB; --creme2:#DCE8EA; --tinta:#101211; --suave:#5A6A6D;
  --fonte:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --marker:'Permanent Marker','Segoe Script','Bradley Hand',cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--creme);color:var(--tinta);font-family:var(--fonte);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
/* A barra fica fixa no topo e a tela desconta a altura dela. Somar 100dvh
   com o padding da barra dava barra de rolagem mesmo quando tudo cabia. */
body{--barra:46px}
body.apresentando{--barra:0px}
.corpo{padding-top:var(--barra)}

/* Telas de conteúdo ROLAM. Antes tinham overflow:hidden e o que não coubesse
   na janela era simplesmente cortado — num portátil ou telemóvel sumia metade
   da página. `safe center` centra quando cabe e encosta no topo quando não
   cabe, em vez de empurrar o começo para fora do alcance. */
.tela{position:relative;min-height:calc(100dvh - var(--barra));padding:0 16px 28px}
.tela.centro{display:flex;flex-direction:column;justify-content:center;
  justify-content:safe center;gap:16px}

/* Só a apresentação ocupa a janela inteira e não rola: ali é projeção. */
.tela.fixa{height:calc(100dvh - var(--barra));overflow:hidden;padding:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rot{text-transform:uppercase;letter-spacing:.14em;font-weight:700}
/* A frase da campanha é o único lugar com a manuscrita: em mais sítios
   viraria piada num culto. */
.assina{font-family:var(--marker);font-weight:400;line-height:1.15;letter-spacing:.01em}
/* A frase da campanha ocupa a linha inteira e o tamanho acompanha a largura
   da janela, para caber de uma vez em vez de partir palavra a palavra. */
.lema{font-size:clamp(20px,5.2vw,54px);line-height:1.06;color:var(--ciano2);
  text-align:center;text-wrap:balance;margin:0}
.cita{font-style:italic;line-height:1.35}
.cita b{font-style:normal;text-transform:uppercase;letter-spacing:.12em;font-size:.72em;font-weight:800;opacity:.75}
.toque{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ciano);outline-offset:3px}
.oculto{display:none!important}

/* barra de navegação, comum a todas as telas */
#nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;gap:6px;flex-wrap:wrap;
  padding:8px 12px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--creme2);
  transition:opacity .25s}
#nav.some{display:none}
#nav a{text-decoration:none;color:var(--suave);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;padding:6px 10px;border-radius:9px}
#nav a.on{background:var(--tinta);color:#fff}
#nav .relogio{margin-left:auto;font-weight:800;font-size:15px}

/* mesa */
.painel{background:#fff;border:1px solid var(--creme2);border-radius:26px;padding:20px}
.grande{font-weight:900;line-height:.85;letter-spacing:-.03em}
.barra{height:clamp(26px,3.4vh,40px);border-radius:99px;background:var(--creme2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--ciano);transition:width .7s ease}
.botoes{display:grid;grid-template-columns:2fr 1fr;gap:12px;height:clamp(130px,20vh,195px);margin-top:14px}
.b1{border:0;border-radius:26px;background:var(--ciano);color:#fff;font-weight:900}
.b1 .n{display:block;font-size:clamp(30px,6vw,52px);line-height:1}
.b1 .l{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.bcol{display:grid;grid-template-rows:1fr 1fr 1fr;gap:12px}
.b2{border:2px solid var(--ciano);border-radius:16px;background:#fff;color:var(--ciano2);font-weight:900;font-size:clamp(18px,3vw,26px)}
.b3{border:2px solid var(--creme2);border-radius:16px;background:#fff;color:var(--suave);font-weight:700;font-size:15px}
.b3[disabled]{opacity:.35}
@keyframes toquePulso{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
.b1.bateu,.b2.bateu,.b3.bateu{animation:toquePulso 180ms ease-out}
@keyframes respira{0%,100%{box-shadow:0 10px 30px -12px rgba(12,195,215,.55),0 0 0 0 rgba(12,195,215,.35)}
 50%{box-shadow:0 16px 40px -10px rgba(12,195,215,.65),0 0 0 14px rgba(12,195,215,0)}}
.b1{animation:respira 2.8s ease-in-out infinite}

/* modal de agradecimento */
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;
  background:rgba(6,42,48,.96);color:#fff;text-align:center}
#modal .ok{width:72px;height:72px;border-radius:99px;background:var(--ciano);display:grid;place-items:center;margin:0 auto 22px;font-size:34px}
#modal .msg{font-size:clamp(20px,4.2vw,40px);font-weight:900;line-height:1.15;max-width:22ch;margin:0 auto}
#modal .vs{margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.2);
  font-size:clamp(15px,2.6vw,26px);color:var(--ciano);max-width:26ch;margin-left:auto;margin-right:auto}
#modal .dica{margin-top:24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}

/* telão */
.escuro{background:var(--noite);color:#fff}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  justify-content:safe center;padding:16px 6vw 104px;overflow:hidden}
.rodape{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  gap:16px;padding:16px 6vw calc(16px + env(safe-area-inset-bottom,0px))}
.marca{display:flex;align-items:center;gap:12px}
.marca img{width:56px;height:56px;border-radius:99px;object-fit:cover}
.marca .nome{font-weight:900;font-size:clamp(15px,2vw,22px);line-height:1.1}
.marca .cid{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.pontos{position:absolute;top:26px;left:6vw;display:flex;gap:6px;z-index:5}
.pontos i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.3)}
.pontos i.on{width:28px;background:var(--ciano)}
/* O relógio vivia na barra de navegação, que sumiu da rota principal. Aqui
   ele fica na própria apresentação, legível de longe. */
.horas{position:absolute;top:22px;right:6vw;font-weight:800;letter-spacing:-.02em;
  font-size:clamp(22px,3.4vw,44px);color:#fff;opacity:.92}
.selo-volta{display:flex;align-items:center;gap:9px;color:#fff;opacity:.95}
.selo-volta svg{width:34px;height:34px;flex:0 0 34px}
.selo-volta b{font-size:clamp(16px,2.2vw,26px);font-weight:900;letter-spacing:-.02em}
.resumo{display:flex;gap:clamp(12px,2.6vw,34px);flex-wrap:wrap;justify-content:flex-end}
.mini{text-align:right;line-height:1}
.mini .r{display:block;font-size:clamp(8px,.85vw,11px);letter-spacing:.14em;
  text-transform:uppercase;opacity:.55;margin-bottom:3px}
.mini .v{display:block;font-weight:900;font-size:clamp(17px,2.8vw,34px);letter-spacing:-.02em}
.mini .v small{font-size:.52em;opacity:.55;font-weight:800}

/* obra */
.obra{background:var(--areia);color:var(--marinho)}
.cartao{background:rgba(255,255,255,.8);border:1px solid var(--areia);border-radius:16px;padding:12px 16px}
.cartao .r{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.cartao .v{font-weight:900;font-size:clamp(20px,3.2vw,32px);line-height:1.1}
/* A igreja é o centro da tela: grande o bastante para se distinguir tijolo
   a tijolo, que é o ponto da metáfora. */
.igreja{width:100%;max-width:min(560px,86vw);height:auto;display:block;margin:0 auto}

/* oliva: carnês e cofrinhos */
.oliva{background:var(--oliva);color:#fff}
.passo{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.passo .n{flex:0 0 28px;height:28px;border-radius:99px;background:var(--ouro);color:var(--oliva2);
  display:grid;place-items:center;font-weight:900;font-size:13px}
.passo .t{font-weight:600;font-size:clamp(14px,1.7vw,20px);line-height:1.3}
.cupom{display:flex;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:10px;color:var(--tinta)}
.cupom .c{flex:1;padding:10px 14px;min-width:0}
.cupom .c .ig{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.cupom .c .pl{font-weight:900;font-size:clamp(14px,1.8vw,20px);line-height:1.2}
.cupom .c .vl{font-size:12px;color:var(--suave)}
.cupom .t{width:42px;display:grid;place-items:center;border-left:2px dashed var(--creme2)}
.cupom .t span{color:#fff;font-size:8px;font-weight:800;letter-spacing:.1em;transform:rotate(-90deg);white-space:nowrap}

/* admin */
.sec{background:#fff;border:1px solid var(--creme2);border-radius:16px;padding:18px;margin-bottom:16px}
.sec h2{margin:0 0 4px;font-size:17px}
.sec p.d{margin:0 0 14px;color:var(--suave);font-size:13px;max-width:70ch}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label.c{display:block}
label.c span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.ent{width:100%;margin-top:5px;padding:9px 12px;border:1px solid var(--creme2);border-radius:11px;background:#fff}
.ent:focus{outline:none;border-color:var(--ciano)}
.bt{border:0;border-radius:11px;background:var(--noite);color:#fff;padding:10px 16px;font-weight:700;cursor:pointer}
.bt.fraco{background:#fff;color:var(--tinta);border:1px solid var(--creme2)}
.bt.perigo{background:#fff;color:#991b1b;border:1px solid #fecaca}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--creme);border-radius:12px;padding:12px}
.tile .r{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.tile .v{font-weight:900;font-size:26px;line-height:1.1}
/* Única porta para o painel, agora que não há menu. Discreta de propósito:
   fica no canto, apagada, e só ganha contraste ao toque. */
#engrenagem{position:fixed;right:12px;bottom:12px;z-index:65;width:46px;height:46px;
  border-radius:99px;display:grid;place-items:center;text-decoration:none;
  font-size:21px;color:#fff;background:rgba(0,0,0,.42);opacity:.75;transition:opacity .2s}
#engrenagem:hover,#engrenagem:focus{opacity:1}
body.admin #engrenagem{display:none}
#confete{position:fixed;inset:0;z-index:75;pointer-events:none;width:100%;height:100%}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:80;
  padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#aviso.ok{background:var(--noite);color:#fff}
#aviso.err{background:#991b1b;color:#fff}
details.msg{border:1px solid var(--creme2);border-radius:12px;margin-bottom:8px;background:#fff}
details.msg>summary{cursor:pointer;list-style:none;padding:10px 12px}
details.msg>summary::-webkit-details-marker{display:none}
details.msg .p{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.msg .q{font-size:11px;color:var(--ciano2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.msg .corpo2{padding:0 12px 12px;border-top:1px solid var(--creme2)}
/* Telemóvel em pé: a coluna dos botões secundários ficava espremida, e a
   barra de navegação ocupava duas linhas roubando altura da tela. */
@media (max-width:560px){
  body{--barra:42px}
  #nav{padding:6px 8px;gap:4px}
  #nav a{font-size:10px;padding:5px 7px;letter-spacing:.06em}
  #nav .relogio{font-size:13px}
  .botoes{grid-template-columns:1fr;height:auto}
  .bcol{grid-template-rows:none;grid-template-columns:1fr 1fr 1fr}
  .b1{min-height:110px}
  .b2,.b3{min-height:54px}
  .marca img{width:44px;height:44px}
  .slide{padding:12px 20px 96px}
  .rodape{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:520px){
  .botoes{height:clamp(96px,26vh,150px)}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ═══════════════════════════════════════════════════════════════════
   2. ESTADO — localStorage, e só
   ═══════════════════════════════════════════════════════════════════ */

var VERSAO='2.0 (arquivo único)';
var CHAVE='admvc/campanhas/v1', CANAL='admvc-campanhas';
var D = carregar(), canal = null;

function fundir(a,b){ var o={},k; for(k in a) o[k]=a[k];
  if(b) for(k in b){ o[k] = (a[k] && typeof a[k]==='object' && !Array.isArray(a[k]))
    ? fundir(a[k], b[k]) : (b[k]===undefined ? a[k] : b[k]); } return o; }

function carregar(){ try{ return fundir(PADRAO, JSON.parse(localStorage.getItem(CHAVE)||'{}')); }
  catch(e){ return fundir(PADRAO,null); } }

function guardar(transmitir){
  try{ localStorage.setItem(CHAVE, JSON.stringify(D)); }
  catch(e){ aviso('err','Sem espaço no navegador. Remova fotos pelo painel.'); }
  if(transmitir!==false && canal){ try{ canal.postMessage(D); }catch(e){} }
  desenhar();
}

try{ canal = new BroadcastChannel(CANAL);
     canal.onmessage=function(ev){ if(ev&&ev.data){ D=fundir(PADRAO,ev.data); desenhar(); } }; }catch(e){}
window.addEventListener('storage',function(ev){
  if(ev.key===CHAVE&&ev.newValue){ try{ D=fundir(PADRAO,JSON.parse(ev.newValue)); desenhar(); }catch(e){} } });

function msgs(){ return (D.mensagens && D.mensagens.length) ? D.mensagens : MENSAGENS; }

/* ═══════════════════════════════════════════════════════════════════
   3. CONTAS — a única fonte de cada número
   ═══════════════════════════════════════════════════════════════════ */

function n(x){ return Number(x)||0; }
function fmt(x){ return new Intl.NumberFormat('pt-PT').format(Math.round(n(x))); }
function eur(x){ return D.moeda+' '+fmt(x); }
function pc(x){ return (Math.round(x*10)/10).toString().replace('.',','); }

/* A obra é dividida em tijolos de valor fixo. O dinheiro é o dado real; os
   tijolos saem dele, para as duas contas nunca discordarem.
     200.000 ÷ 1.000 = 200 tijolos · 9.000 ÷ 1.000 = 9 assentados · 4,5 % */
function contasObra(){
  var o=D.obra, vt=Math.max(1,n(o.valorTijolo)), vo=Math.max(0,n(o.valorObra)), ar=Math.max(0,n(o.arrecadado));
  var tot=Math.max(1,Math.round(vo/vt)), col=Math.min(tot,Math.floor(ar/vt));
  return {tot:tot, col:col, falt:tot-col, pct:vo?Math.min(100,ar/vo*100):0, faltaEur:Math.max(0,vo-ar)};
}
function contasCarnes(){
  var k=D.carnes, com=k.planos.filter(function(p){return n(p.v)>0;});
  var media=com.length?com.reduce(function(s,p){return s+n(p.v);},0)/com.length:0;
  var prev=n(k.retirados)*media*Math.max(1,n(k.parcelas));
  return {media:media, prev:prev, pct:prev?Math.min(100,n(k.arrecadado)/prev*100):0};
}
function contasCofrinhos(){
  var k=D.cofrinhos, ent=Math.max(0,n(k.entregues));
  var dev=Math.min(ent,Math.max(0,n(k.devolvidos)));   // nunca mais de 100 % de retorno
  return {ent:ent, dev:dev, rua:ent-dev, pct:ent?dev/ent*100:0, media:dev?n(k.arrecadado)/dev:0};
}

/* ═══════════════════════════════════════════════════════════════════
   4. PEÇAS
   ═══════════════════════════════════════════════════════════════════ */

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function frase(t,q){ if(!t) return '';
  return '<p class="cita">“'+esc(t)+'”'+(q?' <b>'+esc(q)+'</b>':'')+'</p>'; }

/* A marca do programa VOLTA: a seta de retorno, que é o gesto da campanha —
   a embalagem que volta. Desenhada, para não depender de ficheiro nenhum. */
/* O rodapé da apresentação mostrava só as garrafas. Com quatro campanhas a
   correr ao mesmo tempo, quem olha o telão quer ver o estado de todas — e
   assim cada slide carrega o resumo inteiro, não só o da sua campanha. */
function resumoCampanhas(){
  var o = contasObra(), k = D.carnes, f = contasCofrinhos();
  function item(rot, val, cor){
    return '<div class="mini"><span class="r">'+esc(rot)+'</span>'+
      '<span class="v num"'+(cor?' style="color:'+cor+'"':'')+'>'+val+'</span></div>';
  }
  return '<div class="resumo">'+
    item('garrafas', fmt(D.garrafas.total), 'var(--ciano)')+
    item('tijolos', fmt(o.col)+'<small>/'+fmt(o.tot)+'</small>', 'var(--tijolo)')+
    item('carnês', fmt(k.retirados), 'var(--ouro)')+
    item('cofrinhos', fmt(f.dev)+'<small>/'+fmt(f.ent)+'</small>', 'var(--ouro)')+
    '</div>';
}

function seloVolta(){
  return '<div class="selo-volta"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" '+
    'stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M34 17a13 13 0 1 0 3.2 12.4"/>'+
    '<path d="M37.5 38.5 30 30.5h15Z" fill="currentColor" stroke="none"/></svg><b>volta</b></div>';
}

function marca(claro){
  var img = D.logo ? '<img src="'+D.logo+'" alt="">'
    : '<div style="width:56px;height:56px;border-radius:99px;background:'+(claro?'#fff2':'var(--ciano)')+';flex:0 0 56px"></div>';
  return '<div class="marca">'+img+'<div><div class="nome">'+esc(D.igreja)+'</div>'+
    '<div class="cid">'+esc(D.cidade)+'</div></div></div>';
}

function barra(pct,cor){
  return '<div class="barra"><i style="width:'+Math.max(0,Math.min(100,pct))+'%'+
    (cor?';background:'+cor:'')+'"></i></div>';
}

function aplicar(t,q){ return String(t||'')
  .replace(/\{n\}/g, fmt(q)).replace(/\{garrafas\}/g, q===1?'garrafa':'garrafas'); }

/* Confete em canvas próprio: sem biblioteca, sem imagem, e some sozinho.
   É a comemoração do toque — sem ela, registar uma garrafa não tem resposta
   nenhuma além do número a mudar. */
function confete(forte){
  var cv = document.getElementById('confete');
  if(!cv || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  var ctx = cv.getContext('2d'), L = cv.clientWidth, A = cv.clientHeight;
  if(!L || !A) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = L * dpr; cv.height = A * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var cores = ['#0CC3D7','#7FE3EF','#FFFFFF','#0AA6B7','#C89B4A'];
  var pecas = [], quantas = forte ? 190 : 95, i;
  for(i = 0; i < quantas; i++) pecas.push({
    x: L * (0.15 + Math.random() * 0.7), y: A + Math.random() * 50,
    vx: (Math.random() - 0.5) * 7, vy: -(9 + Math.random() * (forte ? 11 : 7)),
    g: .22 + Math.random() * .12, l: 5 + Math.random() * 7, a: 3 + Math.random() * 6,
    r: Math.random() * 3.14, vr: (Math.random() - 0.5) * .3,
    cor: cores[Math.floor(Math.random() * cores.length)] });

  var t0 = Date.now(), dur = forte ? 3200 : 2200;
  function quadro(){
    var passou = Date.now() - t0, vivos = 0, op = Math.max(0, 1 - passou / dur), p, j;
    ctx.clearRect(0, 0, L, A);
    for(j = 0; j < pecas.length; j++){
      p = pecas[j]; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if(p.y < A + 40) vivos++;
      ctx.save(); ctx.globalAlpha = op; ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.cor; ctx.fillRect(-p.l/2, -p.a/2, p.l, p.a); ctx.restore();
    }
    if(passou < dur && vivos) requestAnimationFrame(quadro); else ctx.clearRect(0, 0, L, A);
  }
  requestAnimationFrame(quadro);
}

var tAviso;
function aviso(tipo,txt){ var e=document.getElementById('aviso');
  e.className=tipo; e.textContent=txt; clearTimeout(tAviso);
  tAviso=setTimeout(function(){ e.className='oculto'; },4000); }

   5. TELAS
   ═══════════════════════════════════════════════════════════════════ */

var ROTAS=[['mesa','Mesa'],['telao','Telão'],['obra','Tijolos'],
           ['carnes','Carnês'],['cofrinhos','Cofrinhos'],['admin','Painel']];

/* Aceita as duas formas: #admin (que funciona por duplo clique) e /admin
   (que funciona publicado, com os rewrites do vercel.json). Quem vem da
   versão anterior tem o /admin na memória — e um endereço que não abre não
   ensina nada a ninguém. */
function rota(){
  var i, alvo = (location.hash || '').replace('#', '').replace(/^\//, '');
  if(!alvo){
    var p = (location.pathname || '').replace(/\/+$/, '');
    alvo = p.substring(p.lastIndexOf('/') + 1).replace(/\.html$/i, '');
  }
  for(i = 0; i < ROTAS.length; i++) if(ROTAS[i][0] === alvo) return alvo;
  if(alvo === 'construcao' || alvo === 'tijolos') return 'obra';
  return 'mesa';
}

function navegacao(){
  var r=rota(), h='';
  for(var i=0;i<ROTAS.length;i++)
    h+='<a href="#'+ROTAS[i][0]+'"'+(ROTAS[i][0]===r?' class="on"':'')+'>'+ROTAS[i][1]+'</a>';
  h+='<span class="relogio num">'+relogio()+'</span>';
  document.getElementById('nav').innerHTML=h;
}
function relogio(){ var d=new Date(), p=function(x){return (x<10?'0':'')+x;};
  return p(d.getHours())+':'+p(d.getMinutes()); }

/* ── Mesa ─────────────────────────────────────────────────────────── */
var sessao=0, tObrigado, tFechar, tRepouso, repouso=true;

function telaMesa(){

      marca(false)+'<div class="horas num" style="position:static;color:var(--tinta);opacity:.8">'+relogio()+'</div></div>'+
    '<div class="assina lema">'+esc(g.assinatura)+'</div>'+

      '<div class="rot" style="font-size:11px;color:var(--suave)">Total arrecadado</div>'+

        '<div class="rot" style="font-size:clamp(13px,1.6vw,18px);color:var(--suave);padding-bottom:12px">garrafas</div></div>'+
      '<div style="margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px" class="rot">'+
        '<span style="color:var(--suave);font-size:clamp(13px,1.7vw,19px)">Meta '+fmt(meta)+'</span>'+
        '<span class="num" style="font-size:clamp(24px,3.6vw,42px);font-weight:900">'+pc(pct)+'%</span></div>'+
      '<div style="margin-top:6px">'+barra(pct)+'</div>'+
      '<p style="margin:12px 0 0;font-size:clamp(14px,1.9vw,21px);color:var(--suave)">'+
        (pct>=100?'Meta alcançada. Glória a Deus!':'Faltam '+fmt(meta-n(g.total))+' garrafas para a meta.')+'</p>'+
    '</div>'+

      '<button class="b1 toque" data-som="1"><span class="n">+1</span><span class="l">Garrafa</span></button>'+

        '<button class="b2 toque" data-som="2">+2</button>'+
        '<button class="b2 toque" data-som="5">+5</button>'+

          (sessao>0?' <small>('+fmt(sessao)+')</small>':' corrigir')+'</button>'+
      '</div></div>'+
    frase(g.versiculo,g.ref)+
  '</div>';

var alvoToque = null;
function somar(q){
  q=n(q);
  if(q<0 && sessao<=0) return;
  D.garrafas.total=Math.max(0,n(D.garrafas.total)+q);
  sessao=Math.max(0,sessao+q);
  guardar();
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  if(alvoToque){ alvoToque.className += ' bateu';
    setTimeout(function(){ if(alvoToque) alvoToque.className = alvoToque.className.replace(' bateu',''); }, 200); }
  adiarRepouso();
  clearTimeout(tObrigado);
  /* 3 s de silêncio antes do agradecimento: cada toque reinicia a contagem,
     para ninguém ser interrompido no meio de uma entrega de doze garrafas. */
  if(sessao>0) tObrigado=setTimeout(agradecer, 3000);

/* ── Tijolos, na silhueta da igreja ──────────────────────────────── */
function igrejaSVG(colocados, total){
  var c = celulasIgreja(total), cels = c.cels, i, t = '';
  /* Cada tijolo assentado pinta UMA célula de verdade, de baixo para cima.
     Se a grelha não fechar exatamente o total pedido, a proporção é mantida —
     mas os números escritos ao lado continuam a ser os exatos. */
  var cheias = total > 0 ? Math.round(colocados / total * cels.length) : 0;
  for(i = 0; i < cels.length; i++){
    var e = cels[i], pintado = i < cheias;
    t += '<rect x="'+e[0]+'" y="'+e[1]+'" width="'+e[2]+'" height="'+e[3]+'" rx="1"'+
         ' fill="'+(pintado?'var(--tijolo)':'#fff')+'"'+
         ' stroke="'+(pintado?'var(--tijolo2)':'var(--tijolo)')+'"'+
         ' stroke-width=".7" stroke-opacity="'+(pintado?'.9':'.28')+'"/>';
  }
  return '<svg viewBox="0 0 200 196" class="igreja" role="img" aria-label="'+
    colocados+' de '+total+' tijolos assentados">'+t+
    '<path d="'+c.sil+'" fill="none" stroke="var(--marinho)" stroke-width="3" stroke-linejoin="round"/>'+
    '<path d="M100 '+c.cume+' L100 8" stroke="var(--marinho)" stroke-width="3" stroke-linecap="round"/>'+
    '<path d="M92 17 L108 17" stroke="var(--marinho)" stroke-width="3" stroke-linecap="round"/>'+
    '<path d="'+c.porta+'" fill="var(--areia)" stroke="var(--marinho)" stroke-width="2.6"/></svg>';
}

/* Ponto dentro do polígono, pelo método do raio. É o que permite saber quais
   células da grelha caem dentro da igreja — o telhado corta as fileiras de
   cima, e sem isto não se sabe quantos tijolos a silhueta comporta. */
function dentro(x, y, poli){
  var d = false, i, j;
  for(i = 0, j = poli.length - 1; i < poli.length; j = i++){
    var xi = poli[i][0], yi = poli[i][1], xj = poli[j][0], yj = poli[j][1];
    if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) d = !d;
  }
  return d;
}

/* Procura o tamanho de tijolo que faz caber, dentro da silhueta, o número
   pedido de tijolos. Cache: a busca roda uma vez por total, não a cada
   redesenho. */
var _cacheIgreja = {};
function celulasIgreja(total){
  if(_cacheIgreja[total]) return _cacheIgreja[total];

  var CHAO = 176, CUME = 30, ESQ = 16, DIR = 184, OMBRO = 104;
  var poli = [[ESQ,CHAO],[ESQ,OMBRO],[100,CUME],[DIR,OMBRO],[DIR,CHAO]];
  var sil = 'M'+ESQ+' '+CHAO+' L'+ESQ+' '+OMBRO+' L100 '+CUME+' L'+DIR+' '+OMBRO+' L'+DIR+' '+CHAO+' Z';
  var pEsq = 86, pDir = 114, pTopo = 132;
  var porta = 'M'+pEsq+' '+CHAO+' L'+pEsq+' '+pTopo+' A14 14 0 0 1 '+pDir+' '+pTopo+' L'+pDir+' '+CHAO;

  var melhor = null, larg;
  for(larg = 4; larg <= 30; larg += 0.25){
    var alt = larg * 0.45, junta = Math.max(.6, larg * 0.09), cels = [], fila = 0, x, y;
    for(y = CHAO - alt; y > CUME - alt; y -= alt + junta){
      var off = (fila % 2) ? -(larg + junta) / 2 : 0;
      for(x = ESQ + off; x < DIR; x += larg + junta){
        var cx = x + larg / 2, cy = y + alt / 2;
        if(!dentro(cx, cy, poli)) continue;
        if(cx > pEsq - 1 && cx < pDir + 1 && cy > pTopo - 8) continue;   /* a porta fica livre */
        cels.push([Math.round(x*10)/10, Math.round(y*10)/10, Math.round(larg*10)/10, Math.round(alt*10)/10]);
      }
      fila++;
    }
    if(!melhor || Math.abs(cels.length - total) < Math.abs(melhor.length - total)) melhor = cels;
    if(melhor.length === total) break;
  }
  var r = { cels: melhor, sil: sil, porta: porta, cume: CUME };
  _cacheIgreja[total] = r;
  return r;
}

    '<div class="tile"><div class="r">Voltaram</div><div class="v num">'+Math.round(cc.pct)+'%</div></div></div>'+
    '<div class="campos">'+campo('Entregues','cofrinhos.entregues','number')+
    campo('Devolvidos','cofrinhos.devolvidos','number')+campo('Arrecadado','cofrinhos.arrecadado','number')+
    campo('Prazo em meses','cofrinhos.meses','number')+campo('Título','cofrinhos.titulo')+'</div></div>';

  h+='<div class="sec"><h2>Igreja</h2><div class="campos">'+
    campo('Nome','igreja')+campo('Cidade','cidade')+campo('Moeda','moeda')+campo('Senha do painel','senha')+'</div>'+
    '<div style="margin-top:12px"><label class="c"><span>Logotipo</span>'+
    '<input class="ent" type="file" accept="image/*" id="logo"></label>'+
    (D.logo?'<img src="'+D.logo+'" style="width:64px;height:64px;border-radius:99px;object-fit:cover;margin-top:8px">':'')+
    '</div></div>';

  var fh='';
  for(i=0;i<D.fotos.length;i++)
    fh+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'+
      '<img src="'+D.fotos[i].src+'" style="width:64px;height:40px;object-fit:cover;border-radius:6px">'+
      '<input class="ent" data-foto="'+i+'" value="'+esc(D.fotos[i].legenda||'')+'" placeholder="Legenda">'+
      '<button class="bt perigo" data-remfoto="'+i+'">Remover</button></div>';
  h+='<div class="sec"><h2>Fotos do telão</h2>'+
    '<p class="d">Guardadas dentro deste navegador. Poucas e leves — o espaço é pequeno.</p>'+
    fh+'<input class="ent" type="file" accept="image/*" id="foto"></div>';

  h+='<div class="sec"><h2>Mensagens</h2><p class="d">'+fmt(msgs().length)+
    ' frases. Use {n} para a quantidade e {garrafas} para o plural.</p>'+
    '<div style="display:flex;gap:8px"><input class="ent" id="nova" placeholder="Obrigado por doar {n} {garrafas}!">'+
    '<button class="bt" id="addmsg">Juntar</button></div></div>';

  h+='<div class="sec"><h2>Sobre</h2><p class="d">Arquivo único · versão '+VERSAO+
    ' · sem internet, sem servidor.<br>Se esta linha não aparecer, o navegador está a abrir '+
    'uma cópia guardada: force a recarga com Ctrl+Shift+R.</p></div>';

  h+='<div class="sec"><h2>Cópia de segurança</h2>'+
    '<p class="d">Tudo o que está guardado, em texto. Copie e guarde antes de um culto grande; cole aqui para restaurar.</p>'+
    '<textarea class="ent" id="backup" rows="4" style="font-family:monospace;font-size:11px">'+esc(JSON.stringify(D))+'</textarea>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><button class="bt" id="restaurar">Restaurar do texto</button>'+
    '<button class="bt perigo" id="zerar">Zerar garrafas</button></div></div>';

  return '<div class="tela" style="max-width:920px;margin:0 auto;padding-bottom:40px">'+
    '<h1 style="font-size:24px;margin:10px 0 16px">Painel</h1>'+h+'</div>';
}

/* ═══════════════════════════════════════════════════════════════════
   6. DESENHO E EVENTOS
   ═══════════════════════════════════════════════════════════════════ */

function desenhar(){
  var r=rota();
  navegacao();
  /* O menu só existe no painel. Nas telas de campanha ele distraía e roubava
     altura — e a rota principal agora mostra todas as campanhas sozinha. */
  var comMenu = (r === 'admin');
  document.getElementById('nav').className = comMenu ? '' : 'some';
  document.body.className = comMenu ? 'admin' : 'apresentando';
  document.getElementById('app').innerHTML =
    r==='telao'? telaTelao() : r==='obra'? telaObra() : r==='carnes'? telaCarnes() :
    r==='cofrinhos'? telaCofrinhos() : r==='admin'? telaAdmin() : telaMesa();
}

document.addEventListener('click', function(ev){
  var t=ev.target, b=t.closest?t.closest('[data-som]'):null;
  if(b){ alvoToque = b; somar(b.getAttribute('data-som')); alvoToque = null; return; }
  if(t.id==='repouso'||(t.closest&&t.closest('#repouso'))){ repouso=false; adiarRepouso(); desenhar(); return; }
  if(t.getAttribute&&t.getAttribute('data-remfoto')!==null&&t.getAttribute('data-remfoto')!==undefined&&t.hasAttribute('data-remfoto')){
    D.fotos.splice(+t.getAttribute('data-remfoto'),1); guardar(); return; }
  if(t.id==='addmsg'){ var e=document.getElementById('nova');
    if(e.value.trim()){ D.mensagens=msgs().slice(); D.mensagens.push({texto:e.value.trim(),versiculo:'',ref:''});
      guardar(); aviso('ok','Frase juntada.'); } return; }
  if(t.id==='restaurar'){ try{ D=fundir(PADRAO,JSON.parse(document.getElementById('backup').value));
      guardar(); aviso('ok','Restaurado.'); }catch(e){ aviso('err','Esse texto não é uma cópia válida.'); } return; }
  if(t.id==='zerar'){ if(confirm('Zerar a contagem de garrafas?')){ D.garrafas.total=0; guardar(); } return; }
});

document.addEventListener('submit', function(ev){
  if(ev.target.id==='entrar'){ ev.preventDefault();
    if(document.getElementById('senha').value===String(D.senha)){ liberado=true; desenhar(); }
    else aviso('err','Senha incorreta.'); }
});

document.addEventListener('change', function(ev){
  var t=ev.target, cam=t.getAttribute('data-campo');
  if(cam){ var part=cam.split('.'), o=D, i;
    for(i=0;i<part.length-1;i++) o=o[part[i]];
    o[part[part.length-1]] = (t.type==='number') ? n(t.value) : t.value;
    guardar(); aviso('ok','Guardado.'); return; }
  if(t.getAttribute('data-plano')!==null && t.hasAttribute('data-plano')){
    var idx=+t.getAttribute('data-plano'), p=t.getAttribute('data-p');
    D.carnes.planos[idx][p] = (p==='v')?n(t.value):t.value; guardar(); return; }
  if(t.hasAttribute('data-foto')){ D.fotos[+t.getAttribute('data-foto')].legenda=t.value; guardar(); return; }
  if(t.id==='logo'||t.id==='foto'){ lerImagem(t.files[0], t.id==='logo'); }
});

/* Reduz a foto antes de guardar: uma imagem de telemóvel tem 8 MB e o
   espaço do navegador é pequeno. 1400px basta para projeção. */
function lerImagem(arq, ehLogo){
  if(!arq) return;
  var fr=new FileReader();
  fr.onload=function(){ var im=new Image();
    im.onload=function(){
      var lado=ehLogo?256:1400, k=Math.min(1,lado/Math.max(im.width,im.height));
      var cv=document.createElement('canvas');
      cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      var url=cv.toDataURL('image/jpeg',.82);
      if(ehLogo) D.logo=url; else D.fotos.push({src:url,legenda:''});
      try{ guardar(); aviso('ok', ehLogo?'Logotipo guardado.':'Foto juntada.'); }
      catch(e){ aviso('err','Sem espaço. Remova alguma foto.'); }
    };
    im.onerror=function(){ aviso('err','Esse arquivo não é uma imagem.'); };
    im.src=fr.result; };
  fr.readAsDataURL(arq);
}

window.addEventListener('hashchange', function(){ repouso=(rota()==='mesa'); desenhar(); });

/* Relógio e carrossel. Um temporizador só para tudo: menos peças, menos
   chance de uma delas ficar rodando sozinha para sempre. */
setInterval(function(){
  var r=rota();
  if(r==='telao'||(r==='mesa'&&repouso)){
    if(Date.now()-(window._ult||0) > Math.max(3,n(D.garrafas.segSlide)||10)*1000){
      window._ult=Date.now(); slide++; desenhar(); return;
    }
  }
  var e=document.querySelector('#nav .relogio'); if(e) e.textContent=relogio();
}, 1000);

/* As fotos padrão vivem na pasta ao lado. Se o arquivo viajou sozinho num
   pen drive, elas não existem — então tiram-se da lista para o carrossel não
   mostrar um slide vazio no meio do culto. */
(function(){
  var restantes = D.fotos.length, mudou = false;
  if(!restantes) return;
  D.fotos.slice().forEach(function(f){
    if(f.src.indexOf('data:')===0){ if(!--restantes && mudou) desenhar(); return; }
    var im = new Image();
    im.onerror = function(){
      var i = D.fotos.indexOf(f);
      if(i>=0){ D.fotos.splice(i,1); mudou = true; }
      if(!--restantes && mudou) desenhar();
    };
    im.onload = function(){ if(!--restantes && mudou) desenhar(); };
    im.src = f.src;
  });
})();

/* Mantém a tela acesa, se o aparelho deixar. Falhar aqui não é problema. */
try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}

desenhar();
</script>
